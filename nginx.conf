server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;

    location /api/auth {
        set $destino http://auth-service:8081;
        proxy_pass $destino;
    }
    location /api/equipos {
        set $destino http://equipment-service:8082;
        proxy_pass $destino;
    }
    location /api/incidencias {
        set $destino http://incident-service:8083;
        proxy_pass $destino;
    }
    location /api/mantenimientos {
        set $destino http://maintenance-service:8084;
        proxy_pass $destino;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
